name: Monthly Supply Chain Forecast

on:
  # Manual trigger only — not scheduled. The Drive upload step can't currently
  # succeed: Google blocks a service account from writing file content to a
  # personal (non-Workspace) Google Drive even into a folder shared with it
  # (confirmed via a live 403 "Service Accounts do not have storage quota").
  # Re-add a `schedule:` block here once that's actually fixed (Workspace
  # account, or swap the service account for a real OAuth user flow) —
  # otherwise this would fail on every scheduled run.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monthly-supply-chain-forecast
  cancel-in-progress: false

jobs:
  run-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account key
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Run predictive model
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python predictive_model.py

      - name: Remove service account key
        if: always()
        run: rm -f service_account.json

      - name: Commit output back to repo
        # Runs even if the previous step failed (e.g. the Drive upload) — the
        # CSV/MD are still worth keeping even when only the upload half fails.
        if: always()
        run: |
          git config user.name "market-pulse-bot"
          git config user.email "actions@github.com"
          git add output/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Monthly forecast: $(date -u +%Y-%m)"
          git push
